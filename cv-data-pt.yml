perfil:
  resumen1: |
    Estatístico com Mestrado em Big Data e especialização em Economia do Risco e Informação,
    com experiência profissional em análise avançada, BI e Inteligência Artificial. Histórico
    comprovado liderando projetos de transformação digital em vários países da América Latina
    para setores estratégicos como saúde, telecomunicações e seguros.

    Especialista em arquitetura de dados, mineração de dados sob metodologia CRISP-DM, modelos
    preditivos, associativos e de classificação, machine learning e visualização estratégica de
    dados. Ampla experiência em design de dashboards e KPIs com ferramentas certificadas de
    visualização de dados e modelagem estatística.

    Com domínio prático de ferramentas de IA generativa — ChatGPT, Claude e Gemini — aplicadas
    a análise de dados, automação de fluxos de trabalho, pesquisa, síntese de informações e
    geração de conteúdo.

    Participante do programa Global Management Immersion Experience (GMIX) da Stanford Graduate
    School of Business e coordenador de projeto no G-Lab do MIT. Docente de Análise Quantitativa
    em pós-graduações do Politécnico Gran Colombiano e formado como Cidadão Cientista de Dados
    pela Colciencias–MINTIC.
  anos_experiencia_laboral: 28
  anos_experiencia_profesional: 18
