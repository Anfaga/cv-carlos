perfil:
  resumen1: |
    Estadístico con Máster en Big Data y especialización en Economía del Riesgo y la Información,
    con experiencia profesional en analítica avanzada, BI e Inteligencia Artificial. Trayectoria
    comprobada liderando proyectos de transformación digital en varios países de Latinoamérica para
    sectores estratégicos como salud, telecomunicaciones y seguros.

    Experto en arquitectura de datos, minería de datos bajo metodología CRISP-DM, modelos predictivos,
    asociativos y de clasificación, machine learning y visualización estratégica de datos. Amplia
    experiencia en diseño de dashboards y KPIs con herramientas certificadas de visualización de datos
    y modelamiento estadístico.

    Con dominio práctico de herramientas de IA generativa — ChatGPT, Claude y Gemini — aplicadas a
    análisis de datos, automatización de flujos de trabajo, investigación, síntesis de información y
    generación de contenido.

    Participante en el programa Global Management Immersion Experience (GMIX) de la Stanford Graduate
    School of Business y coordinador de proyecto en el G-Lab del MIT. Docente de Análisis Cuantitativo
    en posgrados del Politécnico Gran Colombiano y formado como Ciudadano Científico de Datos por
    Colciencias–MINTIC.
  anos_experiencia_laboral: 28
  anos_experiencia_profesional: 18
  edad: ""

